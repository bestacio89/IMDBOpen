services:
  mariadb:
    image: blackwolfben/tpimagesfordiginamic:maridb
    build:
      context: ..
      dockerfile: mariadb.Dockerfile
    container_name: MariDb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-ImdbOpenDB}
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER must be set}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
    ports:
      - "3306:3306"
    volumes:
      - ./MariaDBData:/var/lib/mysql
    networks:
      - app-network

  app:
    image: blackwolfben/tpimagesfordiginamic:spring-app
    build:
      context: ..
      dockerfile: template.Dockerfile
    container_name: TestSpring
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-ImdbOpenDB}
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:?MARIADB_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
    depends_on:
      - mariadb
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
