name: Java CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - docs/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d0e6e4dbf773b98efde945f446d2099b2c0d8fd2 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Validate Docker Compose configuration
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          MARIADB_DATABASE: ImdbOpenDB
          MARIADB_USER: ci-only-user
          MARIADB_PASSWORD: ci-only-application-password
        run: docker compose --file Docker/docker-compose.yml config --quiet

      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: maven-verification-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/checkstyle-result.xml
            **/target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload application artifact
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: imdbopen-application
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
