name: Production CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Verify and publish Docker images
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d0e6e4dbf773b98efde945f446d2099b2c0d8fd2 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify application
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build Docker images
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          MARIADB_DATABASE: ${{ vars.MARIADB_DATABASE || 'ImdbOpenDB' }}
          MARIADB_USER: ${{ secrets.MARIADB_USER }}
          MARIADB_PASSWORD: ${{ secrets.MARIADB_PASSWORD }}
        run: docker compose --file Docker/docker-compose.yml build

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?GitHub Production secret DOCKERHUB_USERNAME is required}"
          : "${DOCKERHUB_TOKEN:?GitHub Production secret DOCKERHUB_TOKEN is required}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push Docker images
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          MARIADB_DATABASE: ${{ vars.MARIADB_DATABASE || 'ImdbOpenDB' }}
          MARIADB_USER: ${{ secrets.MARIADB_USER }}
          MARIADB_PASSWORD: ${{ secrets.MARIADB_PASSWORD }}
        run: docker compose --file Docker/docker-compose.yml push

      - name: Clean up Docker credentials
        if: always()
        run: docker logout || true
